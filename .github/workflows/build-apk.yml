name: Build BilaiTube APK

on:
  push:
    branches: [youtube-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      # ffmpeg-kit.aar (~24 MB) is not stored in this repo; fetch the exact pinned upstream file.
      - name: Fetch ffmpeg-kit.aar
        run: |
          curl -fL --retry 3 -o android/ffmpeg/ffmpeg-kit.aar \
            https://github.com/InfinityLoop1308/PipePipeClient/raw/43ef494c1a1792a774c223e1982ff1e794c49017/ffmpeg/ffmpeg-kit.aar
          ls -l android/ffmpeg/ffmpeg-kit.aar

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace -DskipFormatKtlint 2>&1 | tee ../build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilaiTube-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # On failure, publish the tail of the build log to the `ci-logs` branch so errors are easy to read.
      - name: Publish failure log
        if: failure()
        run: |
          mkdir /tmp/logs && grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Caused by" -A3 build.log | head -400 > /tmp/logs/errors.txt || true
          tail -150 build.log > /tmp/logs/tail.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs && git rm -rf . -q
          cp /tmp/logs/* . && git add errors.txt tail.txt
          git commit -qm "build log for ${GITHUB_SHA}"
          git push -f origin ci-logs

  # Emulator smoke test: installs the APK, drives the UI with adb, and publishes screenshots,
  # UI dumps, jank stats and logcat to the `ci-screenshots` branch (public, readable by the reviewer).
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BilaiTube-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Make a small local sample video for physics tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
            -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/sample.mp4

      - name: Pick x86_64-capable APK
        id: pick
        run: |
          ls -l apk
          echo "apk=$(ls apk/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash scripts/ci-screenshots.sh ${{ steps.pick.outputs.apk }} shots

      - name: Publish to ci-screenshots branch
        if: always()
        run: |
          [ -d shots ] || { echo "no shots"; exit 0; }
          git config user.name ci && git config user.email ci@users.noreply.github.com
          rm -rf /tmp/pub && mkdir -p /tmp/pub/latest && cp -r shots/. /tmp/pub/latest/
          echo "${GITHUB_SHA}" > /tmp/pub/latest/SHA.txt
          git checkout --orphan ci-screenshots && git rm -rf . -q
          cp -r /tmp/pub/. . && git add latest
          git commit -qm "screenshots for ${GITHUB_SHA}"
          git push -f origin ci-screenshots
